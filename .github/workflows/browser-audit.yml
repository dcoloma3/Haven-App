name: Browser Audit (Phase 2)

on:
  schedule:
    # Run every day at 8 AM Pacific (3 PM UTC) — 1 hour after code audit
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    name: Live browser audit with AI visual analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run browser audit
        env:
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
          AUDIT_PASSWORD: ${{ secrets.AUDIT_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PRODUCTION_URL: https://the-haven-app.vercel.app
        run: node scripts/browser-audit.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-screenshots
          path: audit-screenshots/
          retention-days: 7
